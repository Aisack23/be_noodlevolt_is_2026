# La clave `version:` está obsoleta en Compose v2+ y se omite a propósito.
name: si-be-boilerplate

services:
  postgres:
    image: postgres:18-alpine
    container_name: si_be_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:-si_be_boilerplate}
    ports:
      # Se publica en el host para poder correr `prisma migrate` y la API
      # localmente sin entrar al contenedor.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ guarda los datos en un subdirectorio con el nombre de la
      # major version, así que el mount va en /var/lib/postgresql y NO en
      # /var/lib/postgresql/data (que era lo correcto hasta la 17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `api` espera a que este healthcheck pase antes de arrancar, para que
      # las migraciones no fallen contra un Postgres que todavía inicializa.
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-si_be_boilerplate}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: si_be_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Dentro de la red de Compose el host de la base es el nombre del
      # servicio (`postgres`), no `localhost`.
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/${POSTGRES_DB:-si_be_boilerplate}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio, copiá .env.example a .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-7}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      IP_ALLOWLIST: ${IP_ALLOWLIST:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
      RATE_LIMIT_LOGIN_IP: ${RATE_LIMIT_LOGIN_IP:-10}
      RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-30}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-10}
      RATE_LIMIT_REFRESH: ${RATE_LIMIT_REFRESH:-30}
      RATE_LIMIT_WRITES: ${RATE_LIMIT_WRITES:-60}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    # Aplica las migraciones pendientes antes de levantar el servidor.
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  pgdata:
